# แค็ตตาล็อกโมเดลของ April: โมเดลในเครื่อง 1 ตัว + โมเดล cloud หลายตัว
# ค่า ${ENV} / ${ENV:ค่าเริ่มต้น} ถูกแทนจาก environment ตอนโหลด
#
# auto (ค่าเริ่มต้นของ APRIL_DEFAULT_MODEL) = ใช้ cloud ตัวแรกใน auto_order ที่ตั้งค่าครบ
# cloud ตัวไหนล่ม/ไม่มีคีย์/เกินโควตา ก่อนตอบคำแรก -> ไหลไปตัวถัดไป และสุดท้ายคือโมเดลในเครื่องเสมอ
# vision: false = โมเดลมองภาพไม่ได้ (ค่าเริ่มต้น true) — router ตัดภาพออกก่อนส่งให้ตัวนั้น

local:
  id: local
  provider: ollama
  model: ${APRIL_LOCAL_MODEL:qwen3.5:4b}
  label: Qwen 3.5 4B (ในเครื่อง)
  think: false                    # true = ให้โมเดลคิดก่อนตอบ (แม่นขึ้นแต่ช้าลง)
  vision: ${APRIL_LOCAL_VISION:true}   # qwen3.5 มองภาพได้ · เปลี่ยนเป็นโมเดลที่มองไม่ได้ ให้ตั้ง APRIL_LOCAL_VISION=false
  options:
    num_ctx: 16384
    temperature: 0.6

cloud:
  - id: claude-opus
    provider: anthropic
    model: claude-opus-5-5
    label: Claude Opus 5.5
    effort: medium                # low | medium | high | xhigh | max
    api_key_env: ANTHROPIC_API_KEY

  - id: claude-sonnet
    provider: anthropic
    model: claude-sonnet-5-5
    label: Claude Sonnet 5.5
    effort: medium
    api_key_env: ANTHROPIC_API_KEY

  - id: claude-haiku
    provider: anthropic
    model: claude-haiku-5-5
    label: Claude Haiku 5.5
    effort: low
    api_key_env: ANTHROPIC_API_KEY

  - id: gpt-oss
    provider: ollama_cloud
    model: gpt-oss:120b
    label: gpt-oss 120B (Ollama Cloud)
    api_key_env: OLLAMA_API_KEY
    vision: false                 # ข้อความอย่างเดียว — ภาพถูกตัดออก ได้แค่ผลตรวจจับเป็นข้อความ

  - id: openai
    provider: openai
    model: ${APRIL_OPENAI_MODEL:}   # ใส่ชื่อโมเดลใน .env เช่น APRIL_OPENAI_MODEL=...
    label: ChatGPT (OpenAI)
    api_key_env: OPENAI_API_KEY

  - id: gemini
    provider: gemini
    model: ${APRIL_GEMINI_MODEL:}
    label: Gemini (Google)
    api_key_env: GEMINI_API_KEY

auto_order: [claude-opus, claude-sonnet, gpt-oss, openai, gemini]
